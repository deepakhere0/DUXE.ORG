[build]
  base = ""
  publish = "dist"
  command = "npm run build:prod"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  # Disable secrets scanning entirely since Firebase config is meant to be public
  SECRETS_SCAN_ENABLED = "false"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    Access-Control-Allow-Headers = "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-Auth-Token, X-HTTP-Method-Override"
    Access-Control-Max-Age = "86400"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://apis.google.com https://www.gstatic.com https://*.googleapis.com https://tagmanager.google.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://apis.google.com https://www.gstatic.com https://*.googleapis.com https://tagmanager.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://tagmanager.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://ssl.google-analytics.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://accounts.google.com https://*.googleapis.com https://dataconnect.googleapis.com https://*.firebaseapp.com https://generativelanguage.googleapis.com wss://*.firebaseio.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.googleapis.com https://duxe-5c071.firebaseapp.com https://*.firebaseapp.com; object-src 'none';"

# Redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
