[build]
  base = ""
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  # Configure secrets scanning exclusions
  # Firebase config values are meant to be public in client-side apps
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_DATACONNECT_SERVICE_ID,VITE_FIREBASE_DATACONNECT_LOCATION,VITE_USE_EMULATOR"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,*.md,scripts/*,docs/*,dataconnect.yaml,.firebaserc,DEPLOYMENT_CHECKLIST.md,FIREBASE_SETUP.md,GOOGLE_AUTH_SETUP.md,DATACONNECT_README.md,SETUP_DATACONNECT.md"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseapp.com https://*.googleapis.com https://generativelanguage.googleapis.com wss://*.firebaseio.com;"

# Redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
